<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>Tareas</title>
  <meta name="description" content="Lista compartida de tareas del hogar y pendientes para parejas y familias.">

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f1115" id="meta-theme-color">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tareas">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <!-- Cabecera -->
    <header class="app-header">
      <div class="app-header__title">
        <span class="app-header__logo" aria-hidden="true" data-icon="home"></span>
        <div class="app-header__text">
          <!-- Selector de grupo: muestra el grupo activo y abre la lista de grupos -->
          <button class="group-switch" id="group-switch" aria-label="Cambiar de grupo">
            <span class="group-switch__type" id="group-switch-icon"></span>
            <h1 id="header-title">Tareas</h1>
            <span class="group-switch__chev" data-icon="chevron-down"></span>
          </button>
          <button class="app-header__version" id="header-version" title="Ver novedades">v0.0.0</button>
        </div>
      </div>
      <button class="icon-btn" id="btn-sync" title="Sincronizar" aria-label="Sincronizar">
        <span id="sync-icon" data-icon="refresh"></span>
      </button>
    </header>

    <!-- Contenido -->
    <main id="view" class="view"></main>

    <!-- Navegación inferior -->
    <nav class="tabbar" id="tabbar">
      <button class="tabbar__item is-active" data-view="hoy">
        <span class="tabbar__icon" data-icon="home"></span><span class="tabbar__label">Hoy</span>
      </button>
      <button class="tabbar__item" data-view="proximas">
        <span class="tabbar__icon" data-icon="calendar"></span><span class="tabbar__label">Próximas</span>
      </button>
      <button class="tabbar__item" data-view="hechas">
        <span class="tabbar__icon" data-icon="check-circle"></span><span class="tabbar__label">Hechas</span>
      </button>
      <button class="tabbar__item" data-view="grupo">
        <span class="tabbar__icon" data-icon="users"></span><span class="tabbar__label">Grupo</span>
      </button>
      <button class="tabbar__item" data-view="ajustes">
        <span class="tabbar__icon" data-icon="settings"></span><span class="tabbar__label">Ajustes</span>
      </button>
    </nav>
  </div>

  <!-- Contenedor de modales -->
  <div id="modal-root"></div>
  <!-- Contenedor de avisos (toasts) -->
  <div id="toast-root" class="toast-root"></div>

  <script type="module" src="js/app.js"></script>
  <!-- Arranque de seguridad: si app.js no llega a pintar la app (módulo que no
       carga, caché corrupta…), muestra el error y un botón que borra la caché
       del Service Worker y recarga. NO borra las tareas (IndexedDB). -->
  <script>
    (function () {
      var errors = [];
      window.addEventListener('error', function (e) { errors.push(e.message || (e.target && e.target.src) || 'Error'); }, true);
      window.addEventListener('unhandledrejection', function (e) { errors.push(String(e.reason && e.reason.message || e.reason)); });
      setTimeout(function () {
        if (window.__tareasBooted) return;
        var v = document.getElementById('view');
        v.innerHTML = '<div class="card" style="margin:24px 0"><h2 style="margin:0 0 8px">La app no ha podido arrancar</h2>'
          + '<p class="help" style="margin:0 0 12px">Suele pasar tras una actualización a medias. Reparar borra la copia guardada de la app (no tus tareas) y la vuelve a descargar.</p>'
          + '<button class="btn btn--primary btn--block" id="boot-fix">Reparar y recargar</button>'
          + '<pre class="help" style="white-space:pre-wrap;margin:12px 0 0"></pre></div>';
        v.querySelector('pre').textContent = errors.join('\n');
        document.getElementById('boot-fix').onclick = function () {
          var jobs = [];
          if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
          if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
          Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
        };
      }, 5000);
    })();
  </script>
</body>
</html>
